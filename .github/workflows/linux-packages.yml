name: Linux packages

# Builds the crystal-alpha .deb (Ubuntu 24.04 and 26.04, amd64 and arm64) and the
# Arch package (x86_64), smoke-tests each in a clean container, uploads them as
# workflow artifacts, and on a release tag attaches them to the GitHub release
# together with a SHA256SUMS file. Nothing is published to an apt repository or
# the AUR from here. See packaging/.

on:
  pull_request:
    paths:
      - "packaging/**"
      - ".github/workflows/linux-packages.yml"
  push:
    tags:
      - "v*-incremental-*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-packages-${{ github.ref }}
  cancel-in-progress: true

env:
  # actions/checkout v7.0.1, actions/upload-artifact v7.0.1,
  # actions/download-artifact v8.0.1 are pinned by commit SHA below.
  IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}

jobs:
  deb:
    name: deb / ubuntu ${{ matrix.distro }} / ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { distro: "24.04", arch: amd64, runner: ubuntu-24.04 }
          - { distro: "24.04", arch: arm64, runner: ubuntu-24.04-arm }
          - { distro: "26.04", arch: amd64, runner: ubuntu-24.04 }
          - { distro: "26.04", arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Pin the packaging to this release tag
        if: env.IS_TAG == 'true'
        run: packaging/update-pins.sh "$GITHUB_REF_NAME"

      - name: Build .deb
        run: packaging/deb/run-in-container.sh "${{ matrix.distro }}" build-deb.sh

      - name: Smoke test in a clean container
        run: packaging/deb/run-in-container.sh "${{ matrix.distro }}" smoke-test.sh

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deb-ubuntu${{ matrix.distro }}-${{ matrix.arch }}
          path: dist/*.deb
          if-no-files-found: error

  arch:
    name: arch / x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Pin the packaging to this release tag
        if: env.IS_TAG == 'true'
        run: packaging/update-pins.sh "$GITHUB_REF_NAME"

      - name: Build with makepkg and smoke test
        run: packaging/arch/run-in-container.sh

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: arch-x86_64
          path: dist/*.pkg.tar.zst
          if-no-files-found: error

  release:
    name: attach to release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [deb, arch]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Write SHA256SUMS
        working-directory: dist
        run: |
          sha256sum *.deb *.pkg.tar.zst > SHA256SUMS
          cat SHA256SUMS

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # release.yml creates the release on the same tag push; wait for it.
          for i in $(seq 1 30); do
            gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 && break
            echo "waiting for release $GITHUB_REF_NAME ($i/30)"; sleep 20
          done
          gh release view "$GITHUB_REF_NAME" >/dev/null
          gh release upload "$GITHUB_REF_NAME" dist/*.deb dist/*.pkg.tar.zst dist/SHA256SUMS --clobber
