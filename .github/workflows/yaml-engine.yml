name: YAML Engine CI

on:
  push:
    paths:
      - 'src/yaml.cr'
      - 'src/yaml/**'
      - 'spec/std/yaml/**'
      - '.github/workflows/yaml-engine.yml'
  pull_request:
    paths:
      - 'src/yaml.cr'
      - 'src/yaml/**'
      - 'spec/std/yaml/**'
      - '.github/workflows/yaml-engine.yml'
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  libyaml:
    runs-on: ubuntu-latest
    name: "libyaml"
    container: crystallang/crystal:1.20.3-alpine@sha256:0e8bfa2eba31977ce50e6d4522de6cb4b0036f1115eaa3383d559cce38fcd08d
    steps:
      - name: Download Crystal source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Assert select libyaml
        run: bin/crystal eval -Duse_libyaml 'require "yaml"; abort if {{ YAML.has_constant?(:MicaEngine) }}'
      - name: Assert libyaml over Mica
        run: bin/crystal eval -Duse_libyaml -Duse_mica 'require "yaml"; LibYAML.yaml_get_version(out major, out minor, out patch)'
      - name: Show libyaml version
        run: bin/crystal eval -Duse_libyaml 'require "yaml"; puts YAML.libyaml_version'
      - name: Run YAML specs
        run: bin/crystal spec --order=random spec/std/yaml -Duse_libyaml
  mica:
    runs-on: ubuntu-latest
    name: "Mica"
    container: crystallang/crystal:1.20.3-alpine@sha256:0e8bfa2eba31977ce50e6d4522de6cb4b0036f1115eaa3383d559cce38fcd08d
    steps:
      - name: Download Crystal source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Remove libyaml
        run: apk del yaml-dev
      - name: Assert defaulting to Mica
        run: bin/crystal eval 'require "yaml"; abort unless YAML::MicaEngine::LIBYAML_VERSION == {0, 2, 5}'
      - name: Assert -Duse_mica selects the default
        run: bin/crystal eval -Duse_mica 'require "yaml"; abort unless YAML::MicaEngine::LIBYAML_VERSION == {0, 2, 5}'
      - name: Run YAML specs
        run: bin/crystal spec --order=random spec/std/yaml
