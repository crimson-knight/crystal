name: Regex Engine CI

on:
  push:
    paths:
      - 'src/regex.cr'
      - 'src/regex/**'
      - 'spec/std/regex_spec.cr'
      - 'spec/std/regex/**'
      - '.github/workflows/regex-engine.yml'
  pull_request:
    paths:
      - 'src/regex.cr'
      - 'src/regex/**'
      - 'spec/std/regex_spec.cr'
      - 'spec/std/regex/**'
      - '.github/workflows/regex-engine.yml'
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  pcre:
    runs-on: ubuntu-latest
    name: "PCRE"
    container: crystallang/crystal:1.20.3-alpine@sha256:0e8bfa2eba31977ce50e6d4522de6cb4b0036f1115eaa3383d559cce38fcd08d
    steps:
      - name: Download Crystal source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Remove PCRE2
        run: apk del pcre2-dev
      - name: Assert not defaulting to PCRE
        run: bin/crystal eval 'abort unless Regex::Engine == Regex::MicaEngine'
      - name: Show PCRE config
        run: bin/crystal run -Duse_pcre scripts/print_regex_config.cr
      - name: Run Regex specs
        run: bin/crystal spec --order=random spec/std/regex* -Duse_pcre
  pcre2:
    runs-on: ubuntu-latest
    name: "PCRE2"
    container: crystallang/crystal:1.20.3-alpine@sha256:0e8bfa2eba31977ce50e6d4522de6cb4b0036f1115eaa3383d559cce38fcd08d
    steps:
      - name: Download Crystal source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Assert select PCRE2
        run: bin/crystal eval -Duse_pcre2 'abort unless Regex::Engine == Regex::PCRE2'
      - name: Assert PCRE2 over PCRE and Mica
        run: bin/crystal eval -Duse_pcre2 -Duse_pcre -Duse_mica 'abort unless Regex::Engine == Regex::PCRE2'
      - name: Assert select PCRE
        run: bin/crystal eval -Duse_pcre 'abort unless Regex::Engine == Regex::PCRE'
      - name: Show PCRE2 config
        run: bin/crystal run -Duse_pcre2 scripts/print_regex_config.cr
      - name: Run Regex specs
        run: bin/crystal spec --order=random spec/std/regex* -Duse_pcre2
  mica:
    runs-on: ubuntu-latest
    name: "Mica"
    container: crystallang/crystal:1.20.3-alpine@sha256:0e8bfa2eba31977ce50e6d4522de6cb4b0036f1115eaa3383d559cce38fcd08d
    steps:
      - name: Download Crystal source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Remove PCRE2
        run: apk del pcre2-dev
      - name: Assert defaulting to Mica
        run: bin/crystal eval 'abort unless Regex::Engine == Regex::MicaEngine'
      - name: Assert -Duse_mica selects the default
        run: bin/crystal eval -Duse_mica 'abort unless Regex::Engine == Regex::MicaEngine'
      - name: Show Mica config
        run: bin/crystal run scripts/print_regex_config.cr
      - name: Run Regex specs
        run: bin/crystal spec --order=random spec/std/regex*
