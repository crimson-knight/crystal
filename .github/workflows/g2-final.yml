# G2 final evidence on GitHub's ubuntu-24.04 x86-64 runners: the 10,000,000-
# operation BigNum differential (4 jobs x 5 seeds x 500,000), the BigInt bench
# (3 runs on separate runners) and the linkage probe. Temporary: runs on the
# pull request from bench/g2-final, which is closed and deleted afterwards.
# Actions are pinned by commit SHA, Crystal by the official release tarball's
# sha256, GMP by the exact Ubuntu package version.
name: G2 final (x86-64)

on:
  pull_request:
    branches: ['g2-bigint']

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  GMP_VERSION: '2:6.3.0+dfsg-2ubuntu6.1'
  CRYSTAL_TARBALL: https://github.com/crystal-lang/crystal/releases/download/1.21.0/crystal-1.21.0-1-linux-x86_64.tar.gz
  CRYSTAL_SHA256: 744561ee3cee1b06d106cf9ae99b8064b4e017518ac414d6dd23cfafe36560c9

jobs:
  differential:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install GMP and Crystal (pinned)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --allow-downgrades --no-install-recommends libgmp10="$GMP_VERSION" libgmp-dev="$GMP_VERSION"
          curl -sSfL -o /tmp/crystal.tar.gz "$CRYSTAL_TARBALL"
          echo "$CRYSTAL_SHA256  /tmp/crystal.tar.gz" | sha256sum -c -
          sudo mkdir -p /opt/crystal && sudo tar -xzf /tmp/crystal.tar.gz -C /opt/crystal --strip-components=1
          sudo ln -sf /opt/crystal/bin/crystal /usr/local/bin/crystal
      - name: Build and run five seeds
        run: |
          mkdir -p out
          { lscpu | grep "Model name"; uname -m; dpkg-query -W libgmp10 libgmp-dev; sha256sum $(dpkg -L libgmp10 | grep 'libgmp.so.10.[0-9.]*$'); git rev-parse HEAD; } | tee out/host-${{ matrix.shard }}.txt
          crystal --version | tee out/compiler.txt
          CRYSTAL_PATH="$PWD/src" crystal build --release -Duse_gmp scripts/big_num/differential.cr -o big_num_differential
          OPS=$(./big_num_differential --list | grep -v '^pow_mod$' | paste -sd, -)
          for index in 0 1 2 3 4; do
            seed=$((9001 + ${{ matrix.shard }} * 5 + index))
            ./big_num_differential --seed "$seed" --count 500000 --max-bits 8192 --ops "$OPS" \
              --json "out/shard-$seed.json" --reproducers "out/reproducers-$seed" 2>&1 | tail -5 | tee "out/shard-$seed.log"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: differential-${{ matrix.shard }}
          path: out/

  bench:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        run: [1, 2, 3]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install GMP and Crystal (pinned)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --allow-downgrades --no-install-recommends libgmp10="$GMP_VERSION" libgmp-dev="$GMP_VERSION"
          curl -sSfL -o /tmp/crystal.tar.gz "$CRYSTAL_TARBALL"
          echo "$CRYSTAL_SHA256  /tmp/crystal.tar.gz" | sha256sum -c -
          sudo mkdir -p /opt/crystal && sudo tar -xzf /tmp/crystal.tar.gz -C /opt/crystal --strip-components=1
          sudo ln -sf /opt/crystal/bin/crystal /usr/local/bin/crystal
      - name: Build and run the bench
        run: |
          mkdir -p out
          { lscpu | grep -E "Model name|^CPU\(s\)|Hypervisor"; uname -m; dpkg-query -W libgmp10 libgmp-dev; git rev-parse HEAD; } | tee out/host-${{ matrix.run }}.txt
          CRYSTAL_PATH="$PWD/src" crystal build --release -Duse_gmp scripts/big_num/bench.cr -o big_num_bench
          ./big_num_bench --ops "$BENCH_OPS" --bits 64,128,192,256,512,1024,4096 --rounds 6 \
            --json out/bench-${{ matrix.run }}.json --markdown out/bench-${{ matrix.run }}.md 2> out/bench-${{ matrix.run }}.err
        env:
          BENCH_OPS: add,sub,mul,mul_unbalanced,mul_primitive,sqr,divmod,divmod_limb,to_s_10,to_s_16,parse_10,to_s_10_call,to_s_16_call,parse_10_call,parse_16,parse_16_call,to_f64,new_float,compare_float,gcd,isqrt,pow,shift,and,compare,hash,tdiv_q_limb,tdiv_q_half,tdiv_q_short,tdiv_r_limb,tdiv_r_half,tdiv_r_short,tdiv_qr_limb,tdiv_qr_half,tdiv_qr_short,fdiv_q_limb,fdiv_q_half,fdiv_q_short,fdiv_r_limb,fdiv_r_half,fdiv_r_short,fdiv_qr_limb,fdiv_qr_half,fdiv_qr_short,lcm,invert,factorial,remove_10
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: bench-${{ matrix.run }}
          path: out/

  linkage:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install GMP and Crystal (pinned)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --allow-downgrades --no-install-recommends libgmp10="$GMP_VERSION" libgmp-dev="$GMP_VERSION"
          curl -sSfL -o /tmp/crystal.tar.gz "$CRYSTAL_TARBALL"
          echo "$CRYSTAL_SHA256  /tmp/crystal.tar.gz" | sha256sum -c -
          sudo mkdir -p /opt/crystal && sudo tar -xzf /tmp/crystal.tar.gz -C /opt/crystal --strip-components=1
          sudo ln -sf /opt/crystal/bin/crystal /usr/local/bin/crystal
      - name: Linkage probe
        run: |
          CRYSTAL_COMPILER=/opt/crystal/bin/crystal ruby scripts/big_num/linkage_probe.rb out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: linkage
          path: out/
