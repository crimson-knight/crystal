# BigNum differential on GitHub's ubuntu-24.04 x86-64 runners (BIGNUM.md 5.2).
# scripts/big_num/run_sharded.rb --where github fills __SEEDS__, __COUNT__ and
# __ARGUMENTS__, commits this file to the temporary branch
# bench/g2-harness-diff, waits for the run, downloads the shard summaries and
# deletes the branch. Actions are pinned by commit SHA, Crystal by the
# official release tarball's sha256, GMP by the exact Ubuntu package version.
name: BigNum differential (x86-64)

on:
  push:
    branches: ['bench/g2-harness-diff']

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  differential:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: CPU
        run: lscpu | grep -E "Model name|^CPU\(s\)|Hypervisor|Architecture"
      - name: Install GMP (Ubuntu 24.04 package, exact version)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --allow-downgrades --no-install-recommends \
            libgmp10=2:6.3.0+dfsg-2ubuntu6.1 libgmp-dev=2:6.3.0+dfsg-2ubuntu6.1
      - name: Install Crystal 1.21.0 (official tarball, sha256 checked)
        run: |
          curl -sSfL -o /tmp/crystal.tar.gz https://github.com/crystal-lang/crystal/releases/download/1.21.0/crystal-1.21.0-1-linux-x86_64.tar.gz
          echo "744561ee3cee1b06d106cf9ae99b8064b4e017518ac414d6dd23cfafe36560c9  /tmp/crystal.tar.gz" | sha256sum -c -
          sudo mkdir -p /opt/crystal && sudo tar -xzf /tmp/crystal.tar.gz -C /opt/crystal --strip-components=1
          sudo ln -sf /opt/crystal/bin/crystal /usr/local/bin/crystal
      - name: Build and run the shards
        run: |
          mkdir -p out
          { lscpu | grep "Model name"; uname -m; dpkg-query -W libgmp10 libgmp-dev; sha256sum $(dpkg -L libgmp10 | grep 'libgmp.so.10.[0-9.]*$'); } | tee out/host.txt
          crystal --version | tee out/compiler.txt
          CRYSTAL_PATH="$PWD/src" crystal build --release scripts/big_num/differential.cr -o big_num_differential
          for seed in __SEEDS__; do
            ./big_num_differential __ARGUMENTS__ --seed "$seed" --count __COUNT__ \
              --json "out/shard-$seed.json" --reproducers "out/reproducers-$seed" 2>&1 | tail -5 | tee "out/shard-$seed.log"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: bignum-diff-x86_64
          path: out/
